name: Sync flaxhosting_filer FiveM targets

on:
  schedule:
    # A lightweight check runs every six hours. The committed state below
    # permits a full scan only after 72 hours have elapsed.
    - cron: "17 */6 * * *"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

concurrency:
  group: sync-flaxhosting-fivem-targets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out scanner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Decide whether the three-day sync is due
        id: due
        run: node should-run.cjs

      - name: Set up Node.js
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        if: steps.due.outputs.due == 'true'
        run: npm ci

      - name: Run safeguards
        if: steps.due.outputs.due == 'true'
        run: npm test

      - name: Scan Danish servers for flaxhosting_filer
        if: steps.due.outputs.due == 'true'
        run: node scanner.cjs --resource flaxhosting_filer --endpoint auto --output targets.csv

      - name: Replace the Cloudflare D1 inventory
        if: steps.due.outputs.due == 'true'
        env:
          ALLOW_EMPTY_TARGETS: "true"
          FIVEM_AUDITOR_ADMIN_KEY: ${{ secrets.FIVEM_AUDITOR_ADMIN_KEY }}
          FIVEM_AUDITOR_SERVICE_URL: ${{ secrets.FIVEM_AUDITOR_SERVICE_URL }}
        run: node push-targets.cjs targets.csv

      - name: Persist the successful sync time
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sync-state.json
          git diff --cached --quiet || git commit -m "chore: record successful target sync"
          git push

      - name: Record skipped check
        if: steps.due.outputs.due != 'true'
        run: echo "The last successful replacement was less than 72 hours ago."
